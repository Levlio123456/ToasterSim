<!DOCTYPE html>
<html>
    <head>
        <title>ToasterSim</title>
        <style>
            input {
                width: 50px;
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas" width="318" height="651" style="border:1px solid black;margin:0px;padding:0px;position:absolute;left:50%;top:50%;transform:translate(-50%, -50%);object-fit:contain;"></canvas>
        <p id="devInfo">Dev Info</p>
        speed: <input type="number" value="2" step=".1" id="speed" onchange="onValueChange('speed')"><br>
        accel: <input type="number" value="0.3" step=".1" id="accel" onchange="onValueChange('accel')"><br>
        decel: <input type="number" value="0.2" step=".1" id="decel" onchange="onValueChange('decel')"><br>
        stopping: <input type="number" value="0.5" step=".1" id="stopping" onchange="onValueChange('stopping')">
        <script src="script.js"></script>
    </body>
</html>
